name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gera as pastas android/ios/web que o projeto não traz
      - name: Criar pastas de plataforma
        run: flutter create --project-name clima_app .

      # Permissão de internet no build de release (o template só a inclui no debug)
      - name: Adicionar permissão de internet
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: clima-apk
          path: build/app/outputs/flutter-apk/app-release.apk
